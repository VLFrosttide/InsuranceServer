<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title.login">Insurance Broker Portal — Login</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body class="login-body">
    <main class="login-card">
        <div class="lang-switcher" role="group" aria-label="Language">
            <button type="button" data-lang="en">EN</button>
            <button type="button" data-lang="bg">BG</button>
            <button type="button" data-lang="tr">TR</button>
        </div>
        <h1 class="login-title" data-i18n="login.heading">Insurance Broker Portal</h1>
        <p class="login-subtitle" data-i18n="login.subtitle">Brokers &amp; admins</p>
        <form id="LoginForm" autocomplete="off" novalidate>
            <label for="UsernameInput" data-i18n="login.username">Username</label>
            <input id="UsernameInput" name="username" type="text" autocomplete="username" required />

            <label for="PassInput" data-i18n="login.password">Password</label>
            <input id="PassInput" name="password" type="password" autocomplete="current-password" required />

            <label class="remember">
                <input id="RememberInput" type="checkbox" />
                <span data-i18n="login.remember">Remember credentials</span>
            </label>

            <button type="submit" data-i18n="login.button">Login</button>
        </form>
        <p id="DisplayMsg" class="msg" role="alert" aria-live="polite"></p>
        <p class="login-alt"><a href="register.html" data-i18n="login.register">Register</a></p>
    </main>
    <script src="i18n.js"></script>
    <script src="common.js"></script>
    <script src="logic.js"></script>
</body>
</html>
